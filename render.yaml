services:
  - type: web
    name: el-gpt
    env: python
    plan: free
    buildCommand: pip install -r requirements-cloud.txt
    startCommand: uvicorn server.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: GROQ_API_KEY
        sync: false
